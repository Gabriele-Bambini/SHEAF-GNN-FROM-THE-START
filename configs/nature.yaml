# Nature-run config — drives `scripts/run_nature.py`.
# Smaller-than-default to fit a 6h Phase-B GPU budget; bump n_genes/epochs for the
# final paper-grade run.

seed: 42

datasets:
  train: "brca_wu2021"          # primary single-cell training set
  holdout: "biokey"             # P1 internal validation
  zeroshot: "crc_pelka2021"     # P1 BRCA→CRC test
  bulk: "metabric"              # P3 bulk enrichment

data:
  K: 10
  n_genes: 500
  # Pseudotime binning method:
  #   - "dpt": scanpy diffusion pseudotime (biologically grounded, recommended)
  #   - "mean_expr": rank by mean expression (fast but adjacent bins ≈ identical on
  #                  large homogeneous datasets → identity baselines cheat)
  #   - "shuffled": control baseline — random order (all models should degrade)
  pseudotime_method: "dpt"
  alleles: ["WT", "R175H", "R273H", "R248W", "R248Q", "R282W", "G245S", "Y220C"]
  # scPRINT GRN: set to true to replace Pearson-kNN with attention-derived GRN.
  # Requires: pip install scprint
  # Inference runs once per dataset, result is cached as parquet.
  # Falls back to Pearson kNN automatically if scPRINT is unavailable.
  use_scprint_grn: false
  scprint_ckpt: "jkobject/scPRINT"

science:
  strict_real_data: true

model:
  type: "tsgnn"
  stalk_dim: 4           # A4: reduced 8→4 (orthogonal F forces expressiveness; less overfit)
  input_dim: 1
  esm_dim: 1280
  conditioning_dim: 128
  num_diffusion_steps: 3
  use_allele_conditioning: true
  # A1: Project restriction maps to O(d) before Laplacian build.
  # Guarantees gauge-invariance across datasets (BRCA↔CRC comparable).
  # Eigenvalues bounded in [0,2]. Set false to ablate.
  use_orthogonal_maps: true
  # A2: Replace explicit Euler diffusion with Crank-Nicolson implicit (CG solver).
  # Unconditionally stable, energy-monotone, 1 step ≈ 10 explicit steps.
  # τ is learned (initialized 0.2). Set false to ablate.
  use_implicit_diffusion: true
  # A3: predict_delta — DISABLED (HPC ablation 482916: -0.43 r_delta hit).
  # Empirical: paired with sheaf diffusion smoothing, residual gradient
  # misleads — model learns high r_abs (0.45) but anti-correlated delta.
  # See docs/ABLATION_REPORT.md for details. Set true to ablate.
  predict_delta: false
  # B1: Nodal FiLM — DISABLED (HPC ablation 482916: -0.40 r_delta hit).
  # Empirical: with single-allele ESM, per-node × Laplacian-PE injects
  # N independent noise channels. Global FiLM is sufficient and stable.
  # Re-enable when training with real per-cell allele variation.
  use_nodal_film: false
  # B2: Sheaf Neural ODE — continuous pseudotime evolution.
  # Replaces GRU (discrete bin-step) with dR/dτ = f_θ(R, x_endpoints) integrated
  # via RK4 over τ ∈ [0, δt]. Dataset-agnostic dynamics → BRCA-trained ODE
  # generalizes to CRC pseudotime even with different bin counts.
  # Expected Δr_delta: +0.10 (0.33 → 0.43).
  use_neural_ode: true
  ode_hidden_dim: 256
  ode_solver: "rk4"

training:
  lr: 1.0e-3
  epochs: 200            # bumped 50→200: 50 was underfitting (loss still decreasing at end)

# What baselines to sweep in the benchmark phase (see scripts/run_nature.py --phase bench)
benchmarks:
  models: ["tsgnn", "evolvegcn", "temporal_gat", "dysat", "gcn_static", "mlp"]
  seeds: [42, 123, 456]

# Phase-B falsifiable predictions (Nature plan §0)
predictions:
  P1_zeroshot_r_threshold: 0.35
  P2_jaccard_threshold: 0.30
  P3_bh_q_threshold: 0.05
  P4_sheaf_drop_threshold: 0.10
  P5_film_jaccard_threshold: 0.10

# Allele swap pairs to test (P2)
allele_swaps:
  - ["R175H", "R273H"]
  - ["R175H", "R248W"]
  - ["R273H", "R248W"]
  - ["WT",    "R175H"]
