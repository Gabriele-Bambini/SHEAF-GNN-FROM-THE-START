# nature_ovarian.yaml — same as nature.yaml but zeroshot target = HGSOC ovarian
# Zero-shot test: BRCA-trained TS-GNN → HGSOC (Izar 2020, GSE146026)
# Motivation: HGSOC has ~96% TP53 mutation rate vs CRC ~5-15% → same cancer driver,
#             different tissue → tests whether TP53-allele signal is tissue-agnostic.

seed: 42

datasets:
  train: "brca_wu2021"
  holdout: "biokey"
  zeroshot: "ovarian_izar2020"     # ← swap vs nature.yaml (crc_pelka2021)
  bulk: "metabric"

data:
  K: 10
  n_genes: 500
  pseudotime_method: "dpt"
  alleles: ["WT", "R175H", "R273H", "R248W", "R248Q", "R282W", "G245S", "Y220C"]
  use_scprint_grn: false
  scprint_ckpt: "jkobject/scPRINT"

science:
  strict_real_data: true

model:
  type: "tsgnn"
  stalk_dim: 4
  input_dim: 1
  esm_dim: 1280
  conditioning_dim: 128
  num_diffusion_steps: 3
  use_allele_conditioning: true
  use_orthogonal_maps: true
  use_implicit_diffusion: true
  predict_delta: false
  use_nodal_film: false
  use_neural_ode: true
  ode_hidden_dim: 256
  ode_solver: "rk4"

training:
  lr: 1.0e-3
  epochs: 200

benchmarks:
  models: ["tsgnn", "evolvegcn", "temporal_gat", "dysat", "gcn_static", "mlp"]
  seeds: [42, 123, 456]

predictions:
  P1_zeroshot_r_threshold: 0.35
  P2_jaccard_threshold: 0.30
  P3_bh_q_threshold: 0.05
  P4_sheaf_drop_threshold: 0.10
  P5_film_jaccard_threshold: 0.10

allele_swaps:
  - ["R175H", "R273H"]
  - ["R175H", "R248W"]
  - ["R273H", "R248W"]
  - ["WT",    "R175H"]
